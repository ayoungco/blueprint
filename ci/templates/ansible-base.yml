# Shared Ansible CI base configuration
# Include this in domain-specific pipelines

variables:
  ANSIBLE_CONFIG: infra/ansible/ansible.cfg
  ANSIBLE_INVENTORY: infra/ansible/inventories/production/hosts.yml
  ANSIBLE_COLLECTIONS_REQUIREMENTS: infra/ansible/requirements.yml
  ANSIBLE_COLLECTIONS_PATH: "$CI_PROJECT_DIR/.ansible/collections:/root/.ansible/collections:/usr/share/ansible/collections"
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_IMAGE: alpine/ansible:2.20.0

.default_ansible:
  image: $ANSIBLE_IMAGE
  tags: [deploy]
  cache:
    key:
      files:
        - infra/ansible/requirements.yml
    paths:
      - .ansible/collections/
    policy: pull-push
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - ansible --version
    - COLLECTIONS_DIR="$CI_PROJECT_DIR/.ansible/collections"
    - mkdir -p "$COLLECTIONS_DIR"
    - |
      if [ -f "$ANSIBLE_COLLECTIONS_REQUIREMENTS" ]; then
        COLLECTIONS_HASH="$(sha256sum "$ANSIBLE_COLLECTIONS_REQUIREMENTS" | awk '{print $1}')"
        COLLECTIONS_STAMP="$COLLECTIONS_DIR/.requirements_sha256"
        if [ ! -f "$COLLECTIONS_STAMP" ] || [ "$(cat "$COLLECTIONS_STAMP")" != "$COLLECTIONS_HASH" ]; then
          ansible-galaxy collection install -r "$ANSIBLE_COLLECTIONS_REQUIREMENTS" -p "$COLLECTIONS_DIR"
          echo "$COLLECTIONS_HASH" > "$COLLECTIONS_STAMP"
        else
          echo "Using cached Ansible collections from $COLLECTIONS_DIR"
        fi
      fi

.ansible_validate:
  extends: .default_ansible
  stage: validate
  script:
    - ansible-inventory -i "$ANSIBLE_INVENTORY" --list > /dev/null
    - ansible-inventory -i "$ANSIBLE_INVENTORY" --graph
    - |
      for playbook in ${PLAYBOOKS:-infra/ansible/playbooks/site.yml}; do
        if [ "$(basename "$playbook")" = "setup.example.yml" ]; then
          continue
        fi
        ansible-playbook -i "$ANSIBLE_INVENTORY" --syntax-check "$playbook"
      done

.ansible_lint:
  extends: .default_ansible
  stage: validate
  allow_failure: true
  script:
    - ansible-lint --version
    - ansible-lint -c infra/ansible/.ansible-lint ${LINT_PATHS:-infra/ansible/playbooks infra/ansible/roles}

.ansible_connect:
  extends: .default_ansible
  stage: connect
  before_script:
    - !reference [.default_ansible, before_script]
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$ANSIBLE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "Invalid private key material"; exit 3; }
  script:
    - 'echo "Connectivity check for: ${TARGET_HOSTS:-all}"'
    - ansible "${TARGET_HOSTS:-all}" -i "$ANSIBLE_INVENTORY" --list-hosts
    - ansible "${TARGET_HOSTS:-all}" -i "$ANSIBLE_INVENTORY" -m ping --private-key ~/.ssh/id_ed25519
  rules:
    - when: manual
